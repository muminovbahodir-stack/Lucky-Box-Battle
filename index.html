<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>This Game Is Lying</title>
<style>
body {
  margin:0;
  background:black;
  color:white;
  text-align:center;
  font-family:Arial;
}
canvas {
  background:#111;
  display:block;
  margin:0 auto;
}
</style>
</head>
<body>

<h2>This Game Is Lying</h2>
<p>Нажми чтобы прыгнуть</p>

<canvas id="game" width="600" height="300"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = {
  x:50,
  y:200,
  w:30,
  h:30,
  vy:0,
  alive:true
};

let gravity = 0.6;
let obstacles = [];
let chaosObjects = [];
let speed = 4;
let time = 0;

function spawnObstacle(){
  obstacles.push({
    x:600,
    y:220,
    w:30,
    h:30
  });
}

function spawnChaos(){
  chaosObjects.push({
    x:Math.random()*600,
    y:-50,
    vx:(Math.random()-0.5)*6,
    vy:Math.random()*5+2,
    size:Math.random()*30+10
  });
}

function gameLoop(){
  ctx.clearRect(0,0,600,300);

  if(!player.alive){
    ctx.fillText("Ты проиграл 😈",250,150);
    return;
  }

  // гравитация
  player.vy += gravity;
  player.y += player.vy;

  if(player.y > 200){
    player.y = 200;
    player.vy = 0;
  }

  // случайный хаос
  if(Math.random() < 0.03){
    spawnChaos();
  }

  if(Math.random() < 0.05){
    spawnObstacle();
  }

  // неожиданные события
  if(Math.random() < 0.01){
    gravity *= -1; // переворот
  }

  if(Math.random() < 0.01){
    speed += 2; // ускорение
  }

  if(Math.random() < 0.01){
    canvas.style.transform = "rotate(180deg)";
  }

  // препятствия
  obstacles.forEach(o=>{
    o.x -= speed;

    ctx.fillStyle = "red";
    ctx.fillRect(o.x,o.y,o.w,o.h);

    if(collide(player,o)){
      player.alive = false;
    }
  });

  // хаос-объекты
  chaosObjects.forEach(c=>{
    c.x += c.vx;
    c.y += c.vy;

    ctx.fillStyle = "yellow";
    ctx.fillRect(c.x,c.y,c.size,c.size);

    if(collide(player,c)){
      player.alive = false;
    }
  });

  // игрок
  ctx.fillStyle = "cyan";
  ctx.fillRect(player.x,player.y,player.w,player.h);

  time++;
  requestAnimationFrame(gameLoop);
}

function collide(a,b){
  return a.x < b.x + b.w &&
         a.x + a.w > b.x &&
         a.y < b.y + b.h &&
         a.y + a.h > b.y;
}

document.addEventListener("click", ()=>{
  if(player.alive){
    player.vy = -10;
  } else {
    location.reload();
  }
});

gameLoop();
</script>

</body>
</html>
