<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Lucky Box Battle</title>
<style>
body {
  margin:0;
  background:#0f172a;
  color:white;
  font-family:Arial;
  text-align:center;
}
button {
  padding:12px;
  margin:5px;
  border:none;
  border-radius:10px;
  font-weight:bold;
}
</style>
</head>
<body>

<h2>🎁 Lucky Box Battle</h2>

<p>💰 Монеты: <span id="coins">100</span></p>

<button onclick="openBox()">Открыть коробку (50)</button>
<button onclick="fight()">Бой</button>

<h3>Твой персонаж:</h3>
<p id="hero">нет</p>

<h3>Враг:</h3>
<p id="enemy">-</p>

<script>
let coins = 100;
let hero = null;

const heroes = [
  {name:"Кот", power:5, chance:50},
  {name:"Робот", power:10, chance:30},
  {name:"Дракон", power:20, chance:15},
  {name:"Бог", power:50, chance:5}
];

function updateUI(){
  document.getElementById("coins").innerText = coins;
  document.getElementById("hero").innerText = hero ? hero.name + " (сила " + hero.power + ")" : "нет";
}

function openBox(){
  if(coins < 50){
    alert("Нет монет!");
    return;
  }

  coins -= 50;

  let rand = Math.random()*100;
  let sum = 0;

  for(let h of heroes){
    sum += h.chance;
    if(rand <= sum){
      hero = h;
      alert("Выпал: " + h.name);
      break;
    }
  }

  updateUI();
}

function fight(){
  if(!hero){
    alert("Сначала открой коробку!");
    return;
  }

  let enemyPower = Math.floor(Math.random()*40)+5;
  document.getElementById("enemy").innerText = "Сила врага: " + enemyPower;

  if(hero.power >= enemyPower){
    let reward = Math.floor(Math.random()*50)+20;
    coins += reward;
    alert("Победа! +" + reward);
  } else {
    alert("Проиграл 😢");
  }

  updateUI();
}

updateUI();
</script>

</body>
</html>
