<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Lucky Tap Battle</title>
<style>
body{
  margin:0;
  background:#0f172a;
  color:white;
  text-align:center;
  font-family:Arial;
}
#mainBtn{
  margin-top:50px;
  padding:20px;
  font-size:22px;
  border-radius:20px;
  border:none;
  background:#22d3ee;
  font-weight:bold;
}
</style>
</head>
<body>

<h2>🎁 Lucky Tap Battle</h2>

<p>💰 Монеты: <span id="coins">100</span></p>
<p id="info">Нажми чтобы начать</p>

<button id="mainBtn" onclick="tap()">TAP</button>

<script>
let coins = 100;
let hero = null;
let state = "box"; // box → fight

const heroes = [
  {name:"Кот", power:5, chance:50},
  {name:"Робот", power:10, chance:30},
  {name:"Дракон", power:20, chance:15},
  {name:"БОГ", power:50, chance:5}
];

function updateUI(text){
  document.getElementById("coins").innerText = coins;
  document.getElementById("info").innerText = text;
}

function getHero(){
  let rand = Math.random()*100;
  let sum = 0;
  for(let h of heroes){
    sum += h.chance;
    if(rand <= sum) return h;
  }
}

function tap(){

  // 1. ОТКРЫВАЕМ КОРОБКУ
  if(state === "box"){

    if(coins < 50){
      updateUI("Нет монет!");
      return;
    }

    

    hero = getHero();

    updateUI("Выпал: " + hero.name + " (сила " + hero.power + ")");

    state = "fight";
    return;
  }

  // 2. БОЙ
  if(state === "fight"){

    let enemyPower = Math.floor(Math.random()*40)+5;

    if(hero.power >= enemyPower){
      let reward = Math.floor(Math.random()*50)+20;
      coins += reward;
      updateUI("Победа! +" + reward);
    } else {
      updateUI("Проиграл 😢 (враг " + enemyPower + ")");
    }

    state = "box";
  }
}

updateUI("Нажми чтобы открыть коробку");
</script>

</body>
</html>
