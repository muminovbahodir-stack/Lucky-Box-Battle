<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>This Game Is Lying</title>
<style>
body { margin:0; background:black; color:white; text-align:center; }
canvas { background:#111; display:block; margin:0 auto; }
</style>
</head>
<body>

<h2>This Game Is Lying</h2>
<p>Клик = прыжок</p>

<canvas id="game" width="600" height="300"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = {x:60,y:200,w:30,h:30,vy:0};
let gravity = 0.6;
let speed = 4;
let obstacles = [];
let chaos = [];
let gameOver = false;

function spawnObstacle(){
  obstacles.push({x:600,y:220,w:30,h:30});
}

function spawnChaos(){
  chaos.push({
    x:Math.random()*600,
    y:-40,
    vx:(Math.random()-0.5)*4,
    vy:Math.random()*3+2,
    size:20
  });
}

function loop(){
  ctx.clearRect(0,0,600,300);

  if(gameOver){
    ctx.fillText("Ты проиграл (клик = рестарт)",180,150);
    return;
  }

  // игрок
  player.vy += gravity;
  player.y += player.vy;

  if(player.y > 200){
    player.y = 200;
    player.vy = 0;
  }

  // спавн (медленнее!)
  if(Math.random() < 0.02) spawnObstacle();
  if(Math.random() < 0.01) spawnChaos();

  // события (редко!)
  if(Math.random() < 0.002){
    gravity *= -1;
  }

  // препятствия
  obstacles.forEach(o=>{
    o.x -= speed;
    ctx.fillStyle = "red";
    ctx.fillRect(o.x,o.y,o.w,o.h);

    if(hit(player,o)) gameOver = true;
  });

  // падающие штуки
  chaos.forEach(c=>{
    c.x += c.vx;
    c.y += c.vy;

    ctx.fillStyle = "yellow";
    ctx.fillRect(c.x,c.y,c.size,c.size);

    if(hit(player,c)) gameOver = true;
  });

  // игрок
  ctx.fillStyle = "cyan";
  ctx.fillRect(player.x,player.y,player.w,player.h);

  requestAnimationFrame(loop);
}

function hit(a,b){
  return a.x < b.x+b.w &&
         a.x+a.w > b.x &&
         a.y < b.y+b.h &&
         a.y+a.h > b.y;
}

// управление
document.addEventListener("click", ()=>{
  if(gameOver){
    location.reload();
  } else {
    player.vy = -10;
  }
});

loop();
</script>

</body>
</html>
