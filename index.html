<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Lucky Tap Battle</title>
<style>
body{
  margin:0;
  background:#0f172a;
  color:white;
  text-align:center;
  font-family:Arial;
}
#mainBtn{
  margin-top:50px;
  padding:22px;
  font-size:24px;
  border-radius:20px;
  border:none;
  background:#22d3ee;
  font-weight:bold;
}
</style>
</head>
<body>

<h2>🎁 Lucky Tap Battle</h2>

<p id="info">Нажми, чтобы открыть коробку</p>

<button id="mainBtn" onclick="tap()">TAP</button>

<script>
let hero = null;
let state = "box";

const heroes = [
  {name:"Кот", power:5, chance:50},
  {name:"Робот", power:10, chance:30},
  {name:"Дракон", power:20, chance:15},
  {name:"БОГ", power:50, chance:5}
];

function updateUI(text){
  document.getElementById("info").innerText = text;
}

function getHero(){
  let rand = Math.random() * 100;
  let sum = 0;

  for(let h of heroes){
    sum += h.chance;
    if(rand <= sum) return h;
  }
}

function tap(){
  if(state === "box"){
    hero = getHero();
    updateUI("Выпал: " + hero.name + " | сила " + hero.power + ". Нажми ещё раз для боя!");
    state = "fight";
    return;
  }

  if(state === "fight"){
    let enemyPower = Math.floor(Math.random() * 40) + 5;

    if(hero.power >= enemyPower){
      updateUI("✅ Победа! Враг: " + enemyPower + ". Нажми снова для новой коробки.");
    } else {
      updateUI("❌ Проиграл. Враг: " + enemyPower + ". Нажми снова для новой коробки.");
    }

    state = "box";
  }
}
</script>

</body>
</html>
